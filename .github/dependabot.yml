version: 2

# Upstream-drift patrol: the published harness client contract is pinned as a
# devDependency. When the harness ships a newer line, dependabot opens a PR;
# CI's typecheck plus `verify:contract` are the arbiters — a wire drift
# surfaces as a green PR (safe bump) or a failing one (contract change needing
# review). The allow list names exactly the DECLARATION OWNERS this plugin
# depends on — `@deepseek-ai/dsh-api-remotes` re-exports through these, and the
# type seam resolves names into them, so each one moving is a contract signal;
# a wildcard would also patrol the harness's unrelated siblings (transitive
# lockfile churn, one PR per package) and drown that signal.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-name: '@deepseek-ai/dsh-api-remotes'
      - dependency-name: '@deepseek-ai/dsh-client-connection'
      - dependency-name: '@deepseek-ai/dsh-llm'
      - dependency-name: '@deepseek-ai/dsh-settings'
      - dependency-name: '@deepseek-ai/dsh-typert-protocol'
    # One PR for the whole patrol: the owners move together on a harness line,
    # and a single-package bump cannot even resolve (their inter-peers pin the
    # same release — see dsh-scope@0.2.0-rc.1 blocking #30). groups: is the
    # mechanism that delivers the atomic bump the comment above promises.
    groups:
      dsh-contract:
        patterns:
          - '@deepseek-ai/dsh-*'
    open-pull-requests-limit: 1
